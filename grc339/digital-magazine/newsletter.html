<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <link rel="stylesheet" type="text/css" href="style.css" />
      <title>bits&bobs</title>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <link rel="stylesheet" href="https://use.typekit.net/ynr6ulb.css">
   </head>
   <body>
      <div class="newsletter-container">
         <header>
            <h1>
               <a href="index.html"><img src="logo.svg" alt="The bits&bobs logo."/></a>
            </h1>
            <nav>
               <ul>
                  <li><a href="#">Textiles</a></li>
                  <li><a href="#">Graphic Design</a></li>
                  <li><a href="#">3D Art</a></li>
                  <li><a href="#">Music</a></li>
                  <li><a href="#">2D Art</a></li>
               </ul>
            </nav>
         </header>
         <main>
            <figure><img src="newsletter.jpeg" alt="Four people in colorful tights reading newspapers." /></figure>
            <form>
            <section class="personal-info">
               <h2>Personal information</h2>
               <ul>
                  <li><label for="name">Name:</label> <input type="text" name="name" id="name" placeholder="your full name" /></li>
                  <li><label for="email">Email:</label> <input type="email" name="email" id="email" placeholder="example@email.com" /></li>
               </ul>
            </section>
            <section class="newsletter">
               <h2>Which newsletters do you wish to receive?</h2>
               <ul>
                  <li><input type="checkbox" id="Textiles" value="Textiles" /> <label for="Textiles">Textiles</label></li>
                  <li><input type="checkbox" id="2D Art" value="2D Art" /> <label for="2D Art">2D Art</label></li>
                  <li><input type="checkbox" id="3D Art" value="3D Art" /> <label for="3D Art">3D Art</label></li>
               </ul>
            </section>
            <section>
               <button type="submit">Submit</button>
            </section>
         </main>
         <footer>
            <p>All rights reserved.</p>
         </footer>
      </div>
   </body>
</html>
